#DM26-0750

# src/configs/trainer/default.yaml
# Trainer configuration

min_epochs: 700
max_epochs: 1200 #900
accelerator: auto  # auto, cpu, gpu
strategy: auto
devices: 1
precision: 32  # 16, 32, bf16
gradient_clip_val: 1.0
log_every_n_steps: 25
check_val_every_n_epoch: 25
deterministic: false

# Checkpointing
checkpoint_dir: ./checkpoints
save_top_k: 50 #2

# Logging
log_dir: ignore
vis_every_n_epochs: 100
# Scheduler
scheduler:
  patience: 25
  monitor: "val/loss"
  factor: 0.5
  
# Early stopping
early_stopping:
  patience: 100
  enabled: false
  check_finite: true