#DM26-0750

# End-to-end control-interval coverage assessment (run_end_to_end.py).
# checkpoint_path is the trained quantile-mode LitTrajModel; knot_model_path
# is the trained LitKnotModel used to get a per-trajectory knot vector so
# bands can be projected onto control points.
checkpoint_path: "analysis_results/traj/final_baseline_ckpt_d128_r251.ckpt"
knot_model_path: "analysis_results/knots/22.4k_small_model.ckpt"

# Where plots get written.
output_dir: "analysis_results/traj/cp_interval_analysis"

# Number of test trajectories to evaluate. The control-point step builds a
# separate B-spline basis per trajectory (each has its own knot vector), so
# it is a per-trajectory loop and does not benefit from GPU batching the way
# the trajectory-band pass does. Keep this modest.
eval_size: 5000

# Seed for torch and numpy.
analysis_seed: 137

# alpha overrides the nominal miscoverage inferred from the model's
# quantile_levels (alpha = 1 - (q_hi - q_lo)). Uncomment to override.
# alpha: 0.05

# Q, R, w from a prior traj_conformal_analysis.py run on checkpoint_path.
# NOT recalibrated here. Widening per dim is Q * R[d] * w[d].
conformal:
  Q: 9.329e-04
  R: [3.0, 5.0, 3.0, 5.0, 3.0, 5.0, 1.5708, 0.7854, 1.5708, 0.7854, 1.5708, 0.7854]
  w: [0.874, 0.244, 0.877, 0.231, 1.396, 0.398, 2.819, 2.771, 2.694, 2.763, 0.453, 1.584]
