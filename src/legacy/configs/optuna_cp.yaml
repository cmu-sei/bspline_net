#DM26-0750

# @package hydra.sweeper
_target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
direction: minimize
study_name: cp_0002
#max_failure_rate: 0.1 
storage: "sqlite:///outputs/cp_sweep/optuna_cp_0002.db"
n_trials: 200
n_jobs: 2

sampler:
  _target_: optuna.samplers.TPESampler
  seed: 43

params:
  rates.cp_lr: interval(0.000001, 0.002)
  model.cp.rank: 128 #choice(64, 128, 256)
  model.cp.metapos: 256 #choice(32, 48, 64, 128, 256)
  model.cp.trunk_recon_weight: interval(0.0001, 0.01)
  model.cp.trunk_ortho_weight: interval(0.0001,0.01)
  model.cp.trunk_smooth_weight: interval(0.0001,0.01)
  model.cp.branch_recon_weight: interval (0.001, 0.01)
  model.cp.branch_smooth_weight: interval(0.0001, 0.01)
  model.cp.ic_loss_weight: interval(0.0001,0.01)
  model.cp.widths_ic: 	[32,128,32,128,64,128] #choice([32,128,32,128,64,128], [64,256,64,256,128,256], [64,256,128,256,128,256], [64,256,64,256,128,512,128,512], [64,256,64,512])
  model.cp.widths_kcp: [32, 128, 32, 128, 32] #choice([32, 128, 32, 128, 32], [64, 128, 64, 128, 64], [64, 128, 64, 128, 64, 128, 64])

search_space: null
custom_search_space: null