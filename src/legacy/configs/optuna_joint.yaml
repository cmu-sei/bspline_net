#DM26-0750

# @package hydra.sweeper
# NOTE: DANGLING CONFIG. Optuna sweep for the joint model (joint_model.py), which was never
# completed and is NOT used in either paper (IEEE or TMLR). Its parameter names no longer match
# the current model configs (and spacing_loss_weight is listed twice).
_target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
direction: minimize
study_name: joint_0001
#max_failure_rate: 0.1  
storage: "sqlite:///optuna_joint.db"
n_trials: 50
n_jobs: 2

sampler:
  _target_: optuna.samplers.TPESampler
  seed: 42

params:
  rates.knot_lr: interval(0.00001, 0.01)
  rates.cp_lr: interval(0.000001, 0.001)
  model.joint.spacing_loss_weight: interval(0.1, 10.0)
  model.joint.spacing_loss_weight: range(0.1, 10.0, step=0.5)
  model.cp.rank: choice(32,64,128,256,512,1024,2048)
  model.cp.metapos: choice(128,256,512)
  model.knots.ch: choice(6,8,12,24,32)
  model.knots.hidden: choice(32,64,128)

search_space: null
custom_search_space: null