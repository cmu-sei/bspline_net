services:
  hspn:
    build: 
      context: .
      # If you build behind a proxy, uncomment and fill in:
      # args:
      #   - HTTP_PROXY=your_proxy.com:80
      #   - HTTPS_PROXY=your_proxy.com:80
      #   - NO_PROXY=localhost,.local
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # If you run behind a proxy, uncomment and fill in:
      # - HTTP_PROXY=your_proxy.com:80
      # - HTTPS_PROXY=your_proxy.com:80
      # - NO_PROXY=localhost,.local
      # - http_proxy=your_proxy.com:80
      # - https_proxy=your_proxy.com:80
      # - no_proxy=localhost,.local
      - MY_UID=${MY_UID}
      - MY_GID=${MY_GID}
    volumes:
      - ./models:/home/hspn-user/models
      - ./data:/home/hspn-user/data
      - ./src:/home/hspn-user/src
      - ./logs:/home/hspn-user/logs
      - ./tests:/home/hspn-user/tests
      - ./checkpoints:/home/hspn-user/checkpoints
      - ./outputs:/home/hspn-user/outputs
      - ./analysis_results:/home/hspn-user/analysis_results 
    ports:
      - "6006:6006"   # tensorboard
      - "6007:6007"   # tensorboard alternative
      - "8888:8888"   # jupyter
    shm_size: '64g'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stdin_open: true
    tty: true

  hspn-dev:
    extends:
      service: hspn
    build:
      args:
        - DEV=true

